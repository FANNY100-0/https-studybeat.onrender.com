<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calendario - StudyBeat 2026</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        .calendar-container { max-width: 600px; margin: auto; border: 1px solid #ccc; padding: 20px; }
        .nav-links { margin-bottom: 20px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-top: 20px; }
        .day { padding: 10px; border: 1px solid #eee; background: #f9f9f9; }
    </style>
</head>
<body>

    <h1>Calendario</h1>
    
    <div class="nav-links">
        <a href="/">Volver al Inicio</a>
    </div>

    <div class="calendar-container">
        <h2>Junio 2026</h2>
        <div class="calendar-grid">
            <div class="day">Lun</div><div class="day">Mar</div><div class="day">Mié</div>
            <div class="day">Jue</div><div class="day">Vie</div><div class="day">Sáb</div><div class="day">Dom</div>
            
            {% for i in range(1, 31) %}
                <div class="day">{{ i }}</div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
