<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calendario - StudyBeat</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background-color: #f4f7f6; padding: 20px; }
        .nav-back { display: inline-block; margin-bottom: 20px; color: #333; text-decoration: none; font-weight: bold; }
        .calendar-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 10px; 
            max-width: 500px; 
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .day { padding: 15px; border: 1px solid #eee; border-radius: 5px; background: #fff; }
        .header-day { font-weight: bold; color: #555; }
    </style>
</head>
<body>

    <a href="/" class="nav-back">← Volver al inicio</a>
    <h1>Calendario Junio 2026</h1>

    <div class="calendar-grid">
        <div class="header-day">Lun</div><div class="header-day">Mar</div><div class="header-day">Mié</div>
        <div class="header-day">Jue</div><div class="header-day">Vie</div><div class="header-day">Sáb</div><div class="header-day">Dom</div>
        
        {% for day in range(1, 31) %}
            <div class="day">{{ day }}</div>
        {% endfor %}
    </div>

</body>
</html>
