{% extends 'base.html' %}

{% block title %}
Calificaciones
{% endblock %}

{% block content %}

<h1 class="page-title">
    Calificaciones
</h1>

<div class="card">

```
<form
    method="POST"
    action="{{ url_for('add_grade') }}"
    class="form-grid">

    <input
        type="text"
        name="subject"
        placeholder="Materia"
        required>

    <input
        type="number"
        step="0.01"
        min="0"
        max="100"
        name="score"
        placeholder="Calificación"
        required>

    <button type="submit" class="btn">
        Agregar
    </button>

</form>
```

</div>

<div class="card">

```
<h2>
    Promedio General: {{ average }}
</h2>
```

</div>

<div class="card">

```
<table>

    <thead>

        <tr>
            <th>Materia</th>
            <th>Calificación</th>
            <th>Acciones</th>
        </tr>

    </thead>

    <tbody>

        {% for grade in grades %}

        <tr>

            <td>{{ grade.subject }}</td>

            <td>{{ grade.score }}</td>

            <td>

                <a
                    href="{{ url_for('delete_grade', id=grade.id) }}"
                    class="delete-btn">

                    Eliminar

                </a>

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>
```

</div>

{% endblock %}
