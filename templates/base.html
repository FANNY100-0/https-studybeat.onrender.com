<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBeat | Tu ecosistema académico</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">StudyBeat</div>
           <nav>
    <ul>
        <li><a href="{{ url_for('dashboard') }}">🏠 Dashboard</a></li>
        <li><a href="{{ url_for('tareas') }}">📝 Tareas</a></li>
        <li><a href="{{ url_for('calificaciones') }}">📚 Calificaciones</a></li>
        <li><a href="{{ url_for('metas') }}">🎯 Metas</a></li>
        <li><a href="{{ url_for('musica') }}">🎵 Música</a></li>
        <li><a href="{{ url_for('logout') }}">🚪 Cerrar sesión</a></li>
    </ul>
</nav>
            <div class="logout-btn">
                <a href="{{ url_for('logout') }}">🚪 Cerrar sesión</a>
            </div>
        </aside>
        
        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
