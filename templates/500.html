<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 500 | StudyBeat</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#121212;
            color:white;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:20px;
        }

        .container{
            max-width:700px;
        }

        h1{
            font-size:120px;
            color:#1DB954;
            margin-bottom:10px;
        }

        h2{
            margin-bottom:15px;
        }

        p{
            color:#b3b3b3;
            line-height:1.6;
            margin-bottom:25px;
        }

        .buttons{
            display:flex;
            justify-content:center;
            gap:15px;
            flex-wrap:wrap;
        }

        a{
            display:inline-block;
            padding:12px 25px;
            background:#1DB954;
            color:white;
            text-decoration:none;
            border-radius:10px;
            transition:.3s;
        }

        a:hover{
            opacity:.9;
            transform:translateY(-2px);
        }

    </style>

</head>
<body>

    <div class="container">

        <h1>500</h1>

        <h2>Error interno del servidor</h2>

        <p>
            Ocurrió un problema inesperado mientras procesábamos tu solicitud.
            Intenta actualizar la página o vuelve más tarde.
        </p>

        <div class="buttons">

            <a href="/">
                Ir al Inicio
            </a>

            <a href="javascript:location.reload();">
                Reintentar
            </a>

        </div>

    </div>

</body>
</html>
