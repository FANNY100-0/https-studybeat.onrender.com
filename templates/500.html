<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 500 | StudyBeat</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            background:#121212;
            color:#fff;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:20px;
        }

        .container{
            max-width:700px;
        }

        h1{
            font-size:140px;
            color:#1DB954;
            margin-bottom:10px;
        }

        h2{
            font-size:40px;
            margin-bottom:20px;
        }

        p{
            color:#b3b3b3;
            font-size:20px;
            line-height:1.6;
            margin-bottom:30px;
        }

        .buttons{
            display:flex;
            justify-content:center;
            gap:15px;
            flex-wrap:wrap;
        }

        .btn{
            background:#1DB954;
            color:white;
            padding:14px 28px;
            border-radius:12px;
            text-decoration:none;
            transition:.3s;
            font-weight:600;
        }

        .btn:hover{
            transform:translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>500</h1>

        <h2>Error interno del servidor</h2>

        <p>
            Ocurrió un problema inesperado mientras procesábamos tu solicitud.
            Intenta nuevamente dentro de unos minutos.
        </p>

        <div class="buttons">
            <a href="/" class="btn">Ir al Inicio</a>
            <a href="javascript:location.reload();" class="btn">Reintentar</a>
        </div>

    </div>

</body>
</html>
