{% extends 'base.html' %}

{% block title %}
Iniciar Sesión | StudyBeat
{% endblock %}

{% block auth_content %}

<div class="auth-container">

```
<div class="auth-card">

    <h2>Bienvenido a StudyBeat</h2>

    <p class="auth-subtitle">
        Organiza tu vida académica en un solo lugar.
    </p>

    <form method="POST">

        <div class="form-group">

            <label>Correo Electrónico</label>

            <input
                type="email"
                name="email"
                placeholder="correo@ejemplo.com"
                required>

        </div>

        <div class="form-group">

            <label>Contraseña</label>

            <input
                type="password"
                name="password"
                placeholder="********"
                required>

        </div>

        <button
            type="submit"
            class="btn">

            Iniciar Sesión

        </button>

    </form>

    <div class="auth-footer">

        <p>
            ¿No tienes cuenta?
            <a href="{{ url_for('register') }}">
                Regístrate aquí
            </a>
        </p>

    </div>

</div>
```

</div>

{% endblock %}
