<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Calificaciones - StudyBeat</title>
</head>
<body>
    <div class="container">
        <h1>Registro de Notas</h1>
        <form method="POST">
            <input type="text" name="materia" placeholder="Nombre de la materia" required>
            <input type="number" step="0.1" name="valor" placeholder="Calificación" required>
            <button type="submit">Guardar</button>
        </form>
    </div>
</body>
</html>
