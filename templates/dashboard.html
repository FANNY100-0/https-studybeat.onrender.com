{% extends "base.html" %}
{% block content %}

<h1 class="title">Bienvenido a StudyBeat 🎧</h1>

<div class="grid">

    <div class="card">
        <h3>📚 Tareas pendientes</h3>
        <p class="big">{{ pending_tasks }}</p>
    </div>

    <div class="card">
        <h3>✅ Completadas</h3>
        <p class="big">{{ completed_tasks }}</p>
    </div>

    <div class="card">
        <h3>📊 Promedio</h3>
        <p class="big">{{ average }}</p>
    </div>

    <div class="card">
        <h3>🔥 Productividad</h3>
        <p class="big">{{ productivity }}%</p>
    </div>

</div>

<div class="section">

    <div class="card wide">
        <h3>📈 Progreso general</h3>
        <canvas id="chart"></canvas>
    </div>

</div>

<script>
const ctx = document.getElementById('chart');

new Chart(ctx, {
    type: 'doughnut',
    data: {
        labels: ['Completadas', 'Pendientes'],
        datasets: [{
            data: [{{ completed_tasks }}, {{ pending_tasks }}],
            backgroundColor: ['#22c55e', '#ef4444']
        }]
    }
});
</script>

{% endblock %}
