{% extends 'base.html' %}
{% block content %}
<h2>📝 Mis Tareas</h2>
<form method="POST" class="card" style="margin-bottom: 20px;">
    <input type="text" name="titulo" placeholder="Nueva tarea..." required style="padding: 10px; width: 70%;">
    <button type="submit" style="padding: 10px; background: #1DB954; border:none; color:white;">Agregar</button>
</form>
<div class="card">
    {% for t in tareas %}
    <div style="display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #333;">
        {{ t.titulo }}
        <a href="{{ url_for('delete_tarea', id=t.id) }}" style="color: #ff4d4d;">Eliminar</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
