<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Tareas - StudyBeat</title>
</head>
<body>
    <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/tareas">Tareas</a>
    </nav>
    <div class="container">
        <h1>Tus Tareas</h1>
        <div class="card">
            <form method="POST">
                <input type="text" name="titulo" placeholder="Título de la tarea" required style="width: 100%; padding: 10px; margin-bottom: 10px;">
                <button type="submit">Agregar Tarea</button>
            </form>
        </div>
        <ul>
            {% for tarea in tareas %}
            <li>{{ tarea.titulo }} - {% if tarea.completada %} ✅ {% else %} ❌ {% endif %}</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
