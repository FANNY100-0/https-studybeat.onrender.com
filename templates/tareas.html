<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Tareas</title>
</head>
<body>
    <h1>Mis Tareas</h1>
    
    <form action="/tareas" method="POST">
        <input type="text" name="task" placeholder="Escribe una tarea..." required>
        <button type="submit">Agregar</button>
    </form>

    <ul>
        {% for task in tasks %}
            <li>
                {{ task }} 
                <a href="{{ url_for('delete', tipo='tarea', index=loop.index0) }}">[Eliminar]</a>
            </li>
        {% else %}
            <li>No hay tareas pendientes.</li>
        {% endfor %}
    </ul>

    <br>
    <a href="/">Volver al inicio</a>
</body>
</html>
