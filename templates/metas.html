{% extends 'base.html' %}
{% block content %}
<h2>🎯 Mis Metas</h2>
<form method="POST" class="card">
    <input type="text" name="desc" placeholder="Nombre de la meta" required>
    <input type="number" name="progreso" placeholder="Progreso (0-100)" min="0" max="100" required>
    <button type="submit">Registrar Meta</button>
</form>
{% for m in metas %}
<div class="card" style="margin-top: 10px;">
    <p>{{ m.descripcion }}</p>
    <div style="background: #333; height: 10px; border-radius: 5px;">
        <div style="background: #1DB954; width: {{ m.progreso }}%; height: 100%;"></div>
    </div>
</div>
{% endfor %}
{% endblock %}
